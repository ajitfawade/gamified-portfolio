<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 🎮 Visual Anchor Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220%22 width=%22100%22 height=%22100%22><text y=%220.9em%22 font-size=%2290%22>🕹️</text></svg>" />
    
    <!-- 📱 Mobile-First Immersive Viewport Settings -->
    <!-- maximum-scale and user-scalable=no prevent mobile browsers from accidentally zooming in when clicking 3D canvas models -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- 🛡️ Web App & Theme Configuration -->
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>The Dev's Odyssey // Interactive 3D Portfolio</title>
    <meta name="description" content="An immersive 3D gaming portfolio experience built with React Three Fiber, showcasing skills, arcade archives, and interactive challenges." />

    <!-- 🌐 Performance Optimization: Preconnect to Font Servers -->
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
  </head>
  
  <body class="bg-zinc-950 select-none antialiased">
    <!-- 🖥️ WebGL App Root Mount Node -->
    <div id="root"></div>

    <!-- ⚡ Entry Mounting Script Execution Hook -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
